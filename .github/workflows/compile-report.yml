name: Compile Report

# Temporary diagnostic workflow: surfaces rustc/fmt/clippy output as check-run
# annotations and a small artifact, which are readable without access to the
# job log download API.
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - '.github/workflows/compile-report.yml'

jobs:
  fmt:
    name: fmt diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
      - name: rustfmt
        shell: bash
        run: |
          set +e
          cargo +nightly fmt --all -- --check > fmt.log 2>&1
          echo $? > fmt.rc
          wc -c fmt.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fmt-report
          path: |
            fmt.log
            fmt.rc

  clippy:
    name: clippy diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - name: clippy
        shell: bash
        run: |
          set +e
          cargo clippy --all-targets --all-features > clippy.log 2>&1
          echo $? > clippy.rc
          wc -c clippy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clippy-report
          path: |
            clippy.log
            clippy.rc
