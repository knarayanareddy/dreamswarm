name: Compile Report

# TEMPORARY (removed before merge).
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/compile-report.yml'

permissions:
  contents: write

jobs:
  report:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Build with Dockerfile
        shell: bash
        run: |
          mkdir -p .diagnostics
          set +e
          docker build -f Dockerfile -t ds-probe . > .diagnostics/docker.log 2>&1
          echo "docker=$?" | tee .diagnostics/rc.txt
      - name: Publish
        if: always()
        shell: bash
        run: |
          git config user.name "Diagnostics Bot"
          git config user.email "diagnostics@example.invalid"
          git add -f .diagnostics
          git commit -m "chore(diagnostics): docker build log" || exit 0
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
