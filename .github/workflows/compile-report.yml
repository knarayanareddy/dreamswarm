name: Compile Report

# TEMPORARY diagnostic workflow (removed before merge). Runs rustfmt and the
# tests on the runner, then publishes the formatted tree + logs to the branch.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/compile-report.yml'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"
  MSRV: "1.88.0"

jobs:
  report:
    name: fmt + test diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: rustfmt

      - name: Format
        shell: bash
        run: |
          cargo +nightly fmt --all
          mkdir -p .diagnostics
          set +e
          cargo +nightly fmt --all -- --check > .diagnostics/fmt.log 2>&1
          echo "fmt=$?" | tee .diagnostics/rc.txt

      - name: Run tests
        shell: bash
        run: |
          set +e
          cargo test --all-features > .diagnostics/test.log 2>&1
          echo "test=$?" | tee -a .diagnostics/rc.txt

      - name: Publish results
        if: always()
        shell: bash
        run: |
          git config user.name "Diagnostics Bot"
          git config user.email "diagnostics@example.invalid"
          git add -A
          git add -f .diagnostics
          git commit -m "chore(diagnostics): fmt + test results" || exit 0
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
