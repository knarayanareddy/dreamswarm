name: Compile Report

# TEMPORARY diagnostic workflow. Runs the CI formatter/linter on the runner and
# pushes the results (formatted tree + captured logs) back to the branch so the
# output can be read through the API. Slated for deletion before merge.
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - '.github/workflows/compile-report.yml'

permissions:
  contents: write

jobs:
  report:
    name: Diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: rustfmt, clippy

      - name: Format with rustfmt
        shell: bash
        run: |
          cargo +nightly fmt --all
          mkdir -p .diagnostics
          set +e
          cargo +nightly fmt --all -- --check > .diagnostics/fmt.log 2>&1
          echo "fmt=$?" | tee .diagnostics/rc.txt

      - name: Clippy and check
        shell: bash
        run: |
          set +e
          cargo clippy --all-targets --all-features -- -D warnings > .diagnostics/clippy.log 2>&1
          echo "clippy=$?" | tee -a .diagnostics/rc.txt
          cargo check --all-targets --all-features > .diagnostics/check.log 2>&1
          echo "check=$?" | tee -a .diagnostics/rc.txt
          wc -l .diagnostics/*.log

      - name: Publish results
        if: always()
        shell: bash
        run: |
          git config user.name "Diagnostics Bot"
          git config user.email "diagnostics@example.invalid"
          git add -A
          git add -f .diagnostics
          git commit -m "chore(diagnostics): rustfmt + lint results" || exit 0
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
