name: Compile Report

# TEMPORARY diagnostic workflow (removed before merge). Refreshes Cargo.lock,
# reports compiler/test/audit results, and keeps the lockfile only when the
# tree still builds.
on:
  workflow_dispatch:
  push:
    paths:
      - 'Cargo.toml'
      - '.github/workflows/compile-report.yml'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  report:
    name: dependency upgrade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: ./.github/actions/setup-rust

      - name: Update and verify
        shell: bash
        run: |
          mkdir -p .diagnostics
          set +e
          cargo update > .diagnostics/update.log 2>&1
          echo "update=$?" | tee .diagnostics/rc.txt
          cargo check --all-targets --all-features > .diagnostics/check.log 2>&1
          echo "check=$?" | tee -a .diagnostics/rc.txt
          cargo test --all-features > .diagnostics/test.log 2>&1
          echo "test=$?" | tee -a .diagnostics/rc.txt
          cargo deny check advisories > .diagnostics/deny.log 2>&1
          echo "deny=$?" | tee -a .diagnostics/rc.txt

      - name: Publish
        if: always()
        shell: bash
        run: |
          git config user.name "Diagnostics Bot"
          git config user.email "diagnostics@example.invalid"
          git add -A
          git commit -m "chore(diagnostics): dependency upgrade attempt" || exit 0
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
