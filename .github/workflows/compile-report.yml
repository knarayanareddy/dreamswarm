name: Compile Report

# Temporary diagnostic workflow: surfaces rustc output as check-run annotations,
# which are readable without access to the job log/artifact download APIs.
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - '.github/workflows/compile-report.yml'

jobs:
  report:
    name: Compile diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - name: cargo check
        shell: bash
        run: |
          set +e
          cargo check --all-targets --all-features > check.log 2>&1
          rc=$?
          ERRORS=$(grep -cE '^error(\[E[0-9]+\])?:' check.log || true)
          echo "::notice title=Compile summary::exit=$rc errors=$ERRORS lines=$(wc -l < check.log)"
          python3 - "$ERRORS" <<'PY'
          import re, subprocess, sys
          text = open("check.log", encoding="utf-8", errors="replace").read()
          blocks = re.split(r"\n(?=error(?:\[E\d+\])?:)", text)
          errs = [b for b in blocks if re.match(r"error(?:\[E\d+\])?:", b)]
          for block in errs[:10]:
              lines = block.splitlines()
              head = lines[0].strip()
              loc = next((l.strip().lstrip("--> ") for l in lines if l.strip().startswith("-->")), "")
              m = re.match(r"(.+?):(\d+):(\d+)", loc)
              file, line = (m.group(1), m.group(2)) if m else ("",  "1")
              msg = " | ".join(l.strip() for l in lines[1:6] if l.strip())[:900]
              subprocess.run(["echo", f"::error file={file},line={line},title={head[:120]}::{msg or head}"])
          # Also surface the first non-error diagnostics for context.
          warns = re.findall(r"^warning: .*$", text, re.M)[:5]
          for w in warns:
              subprocess.run(["echo", f"::warning::{w[:300]}"])
          PY
          exit $rc
