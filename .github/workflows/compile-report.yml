name: Compile Report

# Temporary diagnostic workflow: surfaces rustc output as check-run annotations,
# which are readable without access to the job log/artifact download APIs.
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - '.github/workflows/compile-report.yml'

jobs:
  report:
    name: Compile diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - name: cargo check
        shell: bash
        run: |
          set +e
          cargo check --all-targets --all-features > check.log 2>&1
          echo $? > rc.txt
          echo "::notice title=Compile summary::exit=$(cat rc.txt) lines=$(wc -l < check.log)"
      - name: Emit log slice 1
        if: always()
        shell: bash
        run: python3 .github/scripts/annotate.py check.log 0 15
      - name: Emit log slice 2
        if: always()
        shell: bash
        run: python3 .github/scripts/annotate.py check.log 15 15
      - name: Emit log slice 3
        if: always()
        shell: bash
        run: python3 .github/scripts/annotate.py check.log 30 15
      - name: Fail if check failed
        shell: bash
        run: exit $(cat rc.txt)
