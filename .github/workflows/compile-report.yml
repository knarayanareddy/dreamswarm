name: Compile Report

# TEMPORARY (removed before merge).
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/compile-report.yml'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  report:
    name: opendal 0.59 probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: ./.github/actions/setup-rust
      - name: Install audit tools
        run: cargo binstall cargo-deny --no-confirm --force
      - name: Probe
        shell: bash
        run: |
          mkdir -p .diagnostics
          set +e
          cargo update > .diagnostics/update.log 2>&1
          echo "update=$?" | tee .diagnostics/rc.txt
          cargo check --all-targets --all-features > .diagnostics/check.log 2>&1
          echo "check=$?" | tee -a .diagnostics/rc.txt
          cargo test --all-features > .diagnostics/test.log 2>&1
          echo "test=$?" | tee -a .diagnostics/rc.txt
          cargo deny check advisories > .diagnostics/deny.log 2>&1
          echo "deny=$?" | tee -a .diagnostics/rc.txt
          grep -A1 'name = "quick-xml"' Cargo.lock | grep version | sort -u >> .diagnostics/update.log
      - name: Publish
        if: always()
        shell: bash
        run: |
          git config user.name "Diagnostics Bot"
          git config user.email "diagnostics@example.invalid"
          git add -A
          git commit -m "chore(diagnostics): opendal 0.59 probe" || exit 0
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
