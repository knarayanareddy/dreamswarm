name: Compile Report

# TEMPORARY (removed before merge). Runs rustfmt + check + clippy + tests and
# publishes the formatted tree and logs back to the branch.
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/compile-report.yml'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  report:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - name: Format
        shell: bash
        run: cargo +nightly fmt --all
      - name: Check, clippy, test
        shell: bash
        run: |
          mkdir -p .diagnostics
          set +e
          cargo +nightly fmt --all -- --check > .diagnostics/fmt.log 2>&1
          echo "fmt=$?" | tee .diagnostics/rc.txt
          cargo check --all-targets --all-features > .diagnostics/check.log 2>&1
          echo "check=$?" | tee -a .diagnostics/rc.txt
          cargo clippy --all-targets --all-features -- -D warnings > .diagnostics/clippy.log 2>&1
          echo "clippy=$?" | tee -a .diagnostics/rc.txt
          cargo test --all-features > .diagnostics/test.log 2>&1
          echo "test=$?" | tee -a .diagnostics/rc.txt
      - name: Publish
        if: always()
        shell: bash
        run: |
          git config user.name "Diagnostics Bot"
          git config user.email "diagnostics@example.invalid"
          git add -A
          git add -f .diagnostics
          git commit -m "chore(diagnostics): verify" || exit 0
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
