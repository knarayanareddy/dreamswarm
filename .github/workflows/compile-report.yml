name: Compile Report

# Temporary diagnostic workflow: surfaces rustc/fmt/clippy output as check-run
# annotations, which are readable without access to the job log download API.
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - '.github/workflows/compile-report.yml'
      - '.github/scripts/annotate_chunks.py'

jobs:
  fmt:
    name: fmt diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: rustfmt
      - name: rustfmt
        shell: bash
        run: |
          set +e
          cargo +nightly fmt --all -- --check > fmt.log 2>&1
          echo $? > fmt.rc
          echo "rc=$(cat fmt.rc) bytes=$(wc -c < fmt.log)"
      - name: Emit fmt log
        if: always()
        shell: bash
        run: python3 .github/scripts/annotate_chunks.py fmt.log FMT 4 || true

  clippy:
    name: clippy diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - name: clippy
        shell: bash
        run: |
          set +e
          cargo clippy --all-targets --all-features -- -D warnings > clippy.log 2>&1
          echo $? > clippy.rc
          echo "rc=$(cat clippy.rc) bytes=$(wc -c < clippy.log)"
      - name: Emit clippy log
        if: always()
        shell: bash
        run: python3 .github/scripts/annotate_chunks.py clippy.log CLIPPY 3 || true
