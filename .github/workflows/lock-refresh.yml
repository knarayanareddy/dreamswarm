name: Temporary lock refresh
on:
  push:
    branches: [arena/e93957e9-dreamswarm]
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo update -p quinn-proto -p rand@0.9.2
      - name: Export chunks 0 to 9
        run: |
          python3 -c "import gzip,base64,pathlib; data=base64.b64encode(gzip.compress(pathlib.Path('Cargo.lock').read_bytes(),mtime=0)).decode(); [print(f'::notice::LOCKCHUNK{i:03d}:{data[i*3000:(i+1)*3000]}') for i in range(0,10) if i*3000<len(data)]"
      - name: Export chunks 10 to 19
        run: |
          python3 -c "import gzip,base64,pathlib; data=base64.b64encode(gzip.compress(pathlib.Path('Cargo.lock').read_bytes(),mtime=0)).decode(); [print(f'::notice::LOCKCHUNK{i:03d}:{data[i*3000:(i+1)*3000]}') for i in range(10,20) if i*3000<len(data)]"
      - name: Export chunks 20 to 29
        run: |
          python3 -c "import gzip,base64,pathlib; data=base64.b64encode(gzip.compress(pathlib.Path('Cargo.lock').read_bytes(),mtime=0)).decode(); [print(f'::notice::LOCKCHUNK{i:03d}:{data[i*3000:(i+1)*3000]}') for i in range(20,30) if i*3000<len(data)]"
      - name: Export chunks 30 to 39
        run: |
          python3 -c "import gzip,base64,pathlib; data=base64.b64encode(gzip.compress(pathlib.Path('Cargo.lock').read_bytes(),mtime=0)).decode(); [print(f'::notice::LOCKCHUNK{i:03d}:{data[i*3000:(i+1)*3000]}') for i in range(30,40) if i*3000<len(data)]"
      - name: Export chunks 40 to 49
        run: |
          python3 -c "import gzip,base64,pathlib; data=base64.b64encode(gzip.compress(pathlib.Path('Cargo.lock').read_bytes(),mtime=0)).decode(); [print(f'::notice::LOCKCHUNK{i:03d}:{data[i*3000:(i+1)*3000]}') for i in range(40,50) if i*3000<len(data)]"
