name: Compile Report

# TEMPORARY diagnostic workflow. Runs the same fmt/clippy/check commands as CI
# and commits the captured output back to the branch under .diagnostics/ so it
# can be read through the contents API. Slated for deletion before merge.
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - '.github/workflows/compile-report.yml'

permissions:
  contents: write

jobs:
  report:
    name: Diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: rustfmt, clippy

      - name: Run checks
        shell: bash
        run: |
          mkdir -p .diagnostics
          set +e
          cargo +nightly fmt --all -- --check > .diagnostics/fmt.log 2>&1
          echo "fmt=$?" | tee .diagnostics/rc.txt
          cargo clippy --all-targets --all-features -- -D warnings > .diagnostics/clippy.log 2>&1
          echo "clippy=$?" | tee -a .diagnostics/rc.txt
          git checkout -- . 2>/dev/null
          git clean -fd src 2>/dev/null
          cargo check --all-targets --all-features > .diagnostics/check.log 2>&1
          echo "check=$?" | tee -a .diagnostics/rc.txt
          wc -l .diagnostics/*.log

      - name: Publish diagnostics
        if: always()
        shell: bash
        run: |
          git config user.name "Diagnostics Bot"
          git config user.email "diagnostics@example.invalid"
          git add -f .diagnostics
          git commit -m "chore(diagnostics): publish check logs" || exit 0
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
